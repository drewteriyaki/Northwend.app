# Northwend as an installable project: `pip install -e .` from this folder
# gives the console commands in cli.py (northwend, northwend-prices, ...).
#
# Install it editable (-e): the app reads its pages (views/), styles, fonts
# (static/) and schema files from this folder, so it runs from here.
# requirements.txt stays - Streamlit Community Cloud and the Tests workflow
# install from it. Keep `dependencies` below the same as its pins (a test
# checks), and list every top-level module in py-modules (a test checks).

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "northwend"
version = "0.1.0"
description = "Northwend - bring holdings from any brokerage and get a plan, income and an AI guide."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.65.0",
    "pandas==2.3.3",
    "altair==6.2.2",
    "yfinance==1.7.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "anthropic==1.11.0",
    "fpdf2==2.8.9",
    "segno==1.6.6",
    "cryptography==50.0.2",
]

[project.scripts]
northwend = "cli:dashboard"
northwend-portfolio = "cli:portfolio"
northwend-prices = "cli:prices"
northwend-history = "cli:history"
northwend-users = "cli:users"
northwend-weekly-email = "cli:weekly_email"
northwend-migrate = "cli:migrate"
northwend-tidy = "cli:tidy"
northwend-licence-check = "cli:licence_check"

[tool.setuptools]
py-modules = [
    "accounts", "admin", "advising", "advisor", "advisor_demo", "advisor_pack", "ai_gateway",
    "ai_spend",
    "ai_usage", "alerts", "whats_new",
    "allocation", "asset_classes", "auth", "brokerages", "changes", "charts", "checkin",
    "checkin_email", "cli", "client_book", "client_csv", "client_plan", "codefresh", "context_card",
    "consent", "access_log",
    "csv_import", "dashboard", "disclosures", "error_alerts", "export", "feature_counts", "fees",
    "friendly_errors", "fund_holdings", "future_notes", "gear", "glossary", "home_tasks", "hosting", "income",
    "invite_codes", "learn", "live_prices",
    "mailer", "manage_users", "manual_entry", "meeting", "metrics", "news", "news_feed", "overview",
    "paste_parse", "perf", "pgcompat", "plans", "portfolio", "prefs", "proposals",
    "reports", "route", "sample_data", "screenshot_read", "settings", "starter_funds", "storms",
    "sync_history", "ticker_search", "two_step", "txn_import", "update_prices", "watchlist",
    "weekly_email",
    "flags", "unsubscribe",   # feature flags and gates; one-click unsubscribe
    # the investor tools: stress test, next deposit, cash check, employer match
    "stress", "next_deposit", "cash_check", "employer_match",
    "menu_decoder",   # the 401(k) Menu Decoder (ROADMAP R5)
    "decoder_public",   # ...and without an account (?decode=401k)
    "factsheet_decoder",   # the Fact Sheet Decoder (ROADMAP R6, fact sheets only)
    # year in review and the account map
    "recap", "account_map",
    "lost_found",   # Lost & Found: finding old accounts (ROADMAP R9)
    "trail_forks",   # Trail Forks: a route per life event (ROADMAP R8)
    "inheritance_rehearsal",   # the Inheritance Rehearsal: a practice run (ROADMAP Someday)
    "seasons",   # the Four Seasons: four moments in the year (ROADMAP R7)
    "weekly",   # weekly summaries: Your week and The week ahead
    "progress_split",   # what you did vs what the market did
    "wins",   # Your wins: one-time milestones from data already kept
    "explain_share",   # Explain it to someone: a figure-free share link (ROADMAP R10)
    "price_report",   # when a price is from, and "Price look wrong?" (PLAN G8)
    "sealed_envelope",   # the Sealed Envelope: the storm drill answer as a PDF
    "drills",   # preparedness drills, one a week (ROADMAP R12)
    "challenges",   # this month's practice challenge (practice money, past prices)
    "month_world",   # this month's world, for your mix: the owner's monthly notes (ROADMAP Phase C)
    "trail_conditions",   # Trail Conditions, the opt-in Monday email (ROADMAP Phase C)
    "pay_yourself",   # Pay yourself: savings as a monthly paycheck (ROADMAP R11)
    "teach_back",   # Teach It Back: explain a Learn topic back, the AI grader (ROADMAP R13)
    "money_minute",   # Today's minute: one small learning card a day on Home
    "expedition_log", "ledger",   # the Expedition Log (R3) and the Do-Nothing Ledger (R2)
    "admin_log",   # the admin action log (PLAN 1b.3)
    "tidy",   # the nightly retention job (northwend-tidy)
    "ai_policy",   # the conclusion policy: the AI's rules and the output check (AI_PLAN 7)
    "ai_library", "ai_tools",   # Ask Northwend's library and calculator tools (AI_PLAN 5)
    # PLAN step 5: the advisor agreement, licence checks (D15), the standing line
    "advisor_agreement", "licence_check", "standing_line",
    "directory",   # the advisor directory and Find a guide (PLAN step 5)
    "intros",   # introductions and the two-step consent to full sharing (PLAN step 5)
    "rate_limits",   # how often one login may upload, save and build downloads (audit 1.8d)
    "glossary_ai",   # the glossary's AI fallback: an unknown word, the term only (AI_PLAN 9)
    "advisor_drafts",   # Draft with Northwend: advisor drafts into an editable box (AI_PLAN 9)
]
# the AI eval set (docs/AI_PLAN.md 8): cases, the offline checker, the runner
packages = ["evals"]

# `ruff check` (the Tests workflow's lint job; requirements-dev.txt has the
# version). A small rule set the code passes today: pyflakes (F: unused or
# undefined names, unused imports) and pycodestyle's import, statement, syntax
# and whitespace checks (E4, E7, E9, W). Line length is not checked.
[tool.ruff]
target-version = "py313"
extend-exclude = ["website/public"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W"]
ignore = [
    "E731",   # a lambda given a name - used on purpose in a few tests
    "E741",   # a one-letter name like `l` or `O`
]

[tool.ruff.lint.per-file-ignores]
# dashboard.py and views/ share one namespace (dashboard's _view runs each
# view inside it): dashboard calls what the views define (F821), imports
# what only the views use (F401, F811), and sets the page up before its
# imports finish (E402). Each view says `# ruff: noqa: F821` itself too.
"dashboard.py" = ["E402", "F401", "F811", "F821"]
"views/*.py" = ["F821"]

# The unit-tests job prints a coverage total (coverage.py, requirements-dev.txt).
# Printed only for now - no gate; ratchet it up, never down.
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "website/*", "scripts/*"]

[tool.coverage.report]
skip_empty = true
