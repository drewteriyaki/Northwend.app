# Northwend as an installable project: `pip install -e .` from this folder
# gives the console commands in cli.py (northwend, northwend-prices, ...).
#
# Install it editable (-e): the app reads its pages (views/), styles, fonts
# (static/) and schema files from this folder, so it runs from here.
# requirements.txt stays - Streamlit Community Cloud and the Tests workflow
# install from it. Keep `dependencies` below the same as its pins (a test
# checks), and list every top-level module in py-modules (a test checks).

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "northwend"
version = "0.1.0"
description = "Northwend - bring holdings from any brokerage and get a plan, income and an AI guide."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.62.0",
    "pandas==2.2.3",
    "altair==6.2.2",
    "yfinance==1.7.0",
    "psycopg[binary]==3.2.3",
    "psycopg-pool==3.2.4",
    "anthropic==1.8.0",
    "fpdf2==2.8.8",
    "segno==1.6.6",
]

[project.scripts]
northwend = "cli:dashboard"
northwend-portfolio = "cli:portfolio"
northwend-prices = "cli:prices"
northwend-history = "cli:history"
northwend-users = "cli:users"
northwend-weekly-email = "cli:weekly_email"
northwend-migrate = "cli:migrate"
northwend-tidy = "cli:tidy"

[tool.setuptools]
py-modules = [
    "accounts", "admin", "advising", "advisor", "advisor_demo", "ai_spend", "ai_usage", "alerts",
    "allocation", "asset_classes", "auth", "brokerages", "changes", "charts", "checkin",
    "checkin_email", "cli", "client_csv", "client_plan", "codefresh",
    "csv_import", "dashboard", "disclosures", "error_alerts", "export", "feature_counts", "fees",
    "friendly_errors", "fund_holdings", "future_notes", "gear", "hosting", "income",
    "invite_codes", "learn", "live_prices",
    "mailer", "manage_users", "manual_entry", "meeting", "metrics", "news", "overview",
    "paste_parse", "perf", "pgcompat", "plans", "portfolio", "prefs", "proposals",
    "reports", "route", "sample_data", "screenshot_read", "settings", "starter_funds", "storms",
    "sync_history", "ticker_search", "two_step", "txn_import", "update_prices", "watchlist",
    "weekly_email",
    "flags", "unsubscribe",   # feature flags and gates; one-click unsubscribe
    # the investor tools: stress test, next deposit, cash check, employer match
    "stress", "next_deposit", "cash_check", "employer_match",
    # year in review and the account map
    "recap", "account_map",
    "expedition_log", "ledger",   # the Expedition Log (R3) and the Do-Nothing Ledger (R2)
    "admin_log",   # the admin action log (PLAN 1b.3)
    "tidy",   # the nightly retention job (northwend-tidy)
]

# `ruff check` (the Tests workflow's lint job; requirements-dev.txt has the
# version). A small rule set the code passes today: pyflakes (F: unused or
# undefined names, unused imports) and pycodestyle's import, statement, syntax
# and whitespace checks (E4, E7, E9, W). Line length is not checked.
[tool.ruff]
target-version = "py313"
extend-exclude = ["website/public"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W"]
ignore = [
    "E731",   # a lambda given a name - used on purpose in a few tests
    "E741",   # a one-letter name like `l` or `O`
]

[tool.ruff.lint.per-file-ignores]
# dashboard.py and views/ share one namespace (dashboard's _view runs each
# view inside it): dashboard calls what the views define (F821), imports
# what only the views use (F401, F811), and sets the page up before its
# imports finish (E402). Each view says `# ruff: noqa: F821` itself too.
"dashboard.py" = ["E402", "F401", "F811", "F821"]
"views/*.py" = ["F821"]

# The unit-tests job prints a coverage total (coverage.py, requirements-dev.txt).
# Printed only for now - no gate; ratchet it up, never down.
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "website/*", "scripts/*"]

[tool.coverage.report]
skip_empty = true
