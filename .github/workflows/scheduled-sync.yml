name: Scheduled sync (hosted Postgres)

# Keeps the Neon Postgres copy fresh for the Streamlit Community Cloud
# deploy. Streamlit Cloud has no background cron of its own, so this
# replaces what the local Windows Scheduled Tasks (scheduled-refresh.cmd /
# scheduled-sync.cmd) do for the local portfolio.db. Both target the same
# DATABASE_URL - portfolio.connect() is dual-mode and routes a Postgres DSN
# through pgcompat.py automatically, so these are the exact same scripts
# used locally, just pointed at Postgres instead of a file path.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL      the Neon connection string
#   FINNHUB_API_KEY   for the price refresh job
# and, for the advisors' Monday email (weekly_email.py) and the monthly
# walk reminders people ask for (checkin_email.py; both skipped until set):
#   RESEND_API_KEY    the same key the app sends email with
#   APP_URL           the app's address, for the link in the email
#   NORTHWEND_FLAGS   the walk reminders go out only when it lists "walk" (flags.py)
# A job that fails emails the admin (error_alerts.py, at most once an hour per
# job) with RESEND_API_KEY, to the ALERT_EMAIL secret or support@northwend.app.
# The refresh job covers every account (--all-users, each ticker fetched
# once); sync_history.py is account-agnostic too, since market data is
# shared across accounts.

on:
  schedule:
    # Live price refresh - every 15 minutes, market hours only
    # (13:30-20:15 UTC covers 9:30am-4:15pm ET, including DST slop).
    - cron: "*/15 13-20 * * 1-5"
    # Daily history sync (Yahoo daily/intraday bars + fundamentals) and the
    # retention tidy (tidy.py) - once after market close, 21:30 UTC.
    - cron: "30 21 * * 1-5"
    # Advisors' Monday email - 12:30 UTC, early morning in the US.
    - cron: "30 12 * * 1"
    # Monthly walk reminders (only for those who turned them on, at most
    # one a month each) - daily at 13:15 UTC, morning in the US.
    - cron: "15 13 * * *"
  workflow_dispatch: {}  # allow manual triggering from the Actions tab

# Once the database roles are split (docs/DB_ROLES.md), DATABASE_URL is the
# jobs role's, which can't change tables: set the repository *variable*
# (Settings > Secrets and variables > Actions > Variables)
# NORTHWEND_SKIP_SCHEMA_SETUP to 1. Unset, the jobs set the schema up at
# start as they always have.
env:
  NORTHWEND_SKIP_SCHEMA_SETUP: ${{ vars.NORTHWEND_SKIP_SCHEMA_SETUP }}

jobs:
  refresh:
    if: github.event.schedule == '*/15 13-20 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Refresh live prices
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_prices.py --db "$DATABASE_URL" --all-users
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Refresh live prices" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  sync:
    if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Sync price history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_history.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Sync price history" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # The retention schedule (PLAN D5), applied nightly with the history sync:
  # never-confirmed sign-ups past 30 days, old error records, expired links and
  # sessions, day-old counts (tidy.py). Its own job, so a failed history sync
  # doesn't skip it and each failure is reported by name. Prints counts only.
  tidy:
    if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Tidy by the retention schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python tidy.py --db "$DATABASE_URL"
      # D15: how many advisors are due a licence re-check (11 months since
      # the last, or none on record) - counts only, emailed to the admin at
      # most once a week while any are (licence_check.py). Skipped quietly
      # without RESEND_API_KEY.
      - name: Count advisors due a licence check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python licence_check.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Nightly tidy" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  weekly-email:
    if: github.event.schedule == '30 12 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Send advisors their Monday email
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python weekly_email.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Advisors' Monday email" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  checkin-email:
    if: github.event.schedule == '15 13 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Send monthly walk reminders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          # the walk's feature flag (flags.py): nothing is sent unless it lists "walk"
          NORTHWEND_FLAGS: ${{ secrets.NORTHWEND_FLAGS }}
        run: python checkin_email.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Monthly walk reminders" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
