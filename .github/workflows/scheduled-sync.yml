name: Scheduled sync (hosted Postgres)

# Keeps the Neon Postgres copy fresh for the Streamlit Community Cloud
# deploy. Streamlit Cloud has no background cron of its own, so this
# replaces what the local Windows Scheduled Tasks (scheduled-refresh.cmd /
# scheduled-sync.cmd) do for the local portfolio.db. Both target the same
# DATABASE_URL - portfolio.connect() is dual-mode and routes a Postgres DSN
# through pgcompat.py automatically, so these are the exact same scripts
# used locally, just pointed at Postgres instead of a file path.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL      the Neon connection string
#   FINNHUB_API_KEY   for the price refresh job
# and, for the advisors' Monday email (weekly_email.py) and the monthly
# walk reminders people ask for (checkin_email.py; both skipped until set):
#   RESEND_API_KEY    the same key the app sends email with
#   APP_URL           the app's address, for the link in the email
#   NORTHWEND_FLAGS   the walk reminders go out only when it lists "walk" (flags.py),
#                     and Trail Conditions only when it lists "trail_conditions"
# and, for announced dividend dates (dividend_dates.py; skipped until set):
#   POLYGON_API_KEY   a Polygon / Massive key (the free plan is enough)
# and, for the nightly seat check with Stripe (billing.py; skipped until set):
#   STRIPE_SECRET_KEY the live restricted key (docs/RUNBOOK.md, "Billing: Stripe setup")
# A job that fails emails the admin (error_alerts.py, at most once an hour per
# job) with RESEND_API_KEY, to the ALERT_EMAIL secret or admin@northwend.app.
# The refresh job covers every account (--all-users, each ticker fetched
# once); sync_history.py is account-agnostic too, since market data is
# shared across accounts.

on:
  schedule:
    # Live price refresh - every 15 minutes, market hours only
    # (13:30-20:15 UTC covers 9:30am-4:15pm ET, including DST slop).
    - cron: "*/15 13-20 * * 1-5"
    # Daily history sync (Yahoo daily/intraday bars + fundamentals) and the
    # retention tidy (tidy.py) - once after market close, 21:30 UTC.
    - cron: "30 21 * * 1-5"
    # Advisors' Monday email - 12:30 UTC, early morning in the US.
    - cron: "30 12 * * 1"
    # Monthly walk reminders (only for those who turned them on, at most
    # one a month each) - daily at 13:15 UTC, morning in the US.
    - cron: "15 13 * * *"
    # Trail Conditions, the opt-in Monday note (trail_conditions.py; only for
    # those who turned it on, at most once a week each) - Mondays at 13:00
    # UTC, morning in the US.
    - cron: "0 13 * * 1"
    # Your news (news_feed.py; only while NORTHWEND_FLAGS lists "news_feed"):
    # headlines for every held or watched ticker, hourly from 11:07 to 23:07
    # UTC (early morning to evening in the US), every day. News moves slower
    # than prices, and the feed shows the last 3 days, so hourly is plenty; at
    # :07 it's clear of the price job's :00/:15/:30/:45. One call per ticker,
    # 1.5 s apart (at most 40 a minute of Finnhub's free 60, leaving room for
    # the prices), at most 250 tickers a run, the oldest-fetched first.
    - cron: "7 11-23 * * *"
    # Paid advisor seats (billing.py --sync): every known Stripe subscription
    # read and each seat's status updated - nightly at 06:20 UTC, every day.
    # Billing by pull (ADR 0004): there is no webhook, so this is how a
    # cancellation or a failed payment reaches the app; the grace days absorb
    # the wait. Does nothing until the STRIPE_SECRET_KEY secret is set.
    - cron: "20 6 * * *"
  workflow_dispatch: {}  # allow manual triggering from the Actions tab

# Once the database roles are split (docs/DB_ROLES.md), DATABASE_URL is the
# jobs role's, which can't change tables: set the repository *variable*
# (Settings > Secrets and variables > Actions > Variables)
# NORTHWEND_SKIP_SCHEMA_SETUP to 1. Unset, the jobs set the schema up at
# start as they always have.
env:
  NORTHWEND_SKIP_SCHEMA_SETUP: ${{ vars.NORTHWEND_SKIP_SCHEMA_SETUP }}

jobs:
  refresh:
    if: github.event.schedule == '*/15 13-20 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Refresh live prices
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python update_prices.py --db "$DATABASE_URL" --all-users
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Refresh live prices" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  sync:
    if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Sync price history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_history.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Sync price history" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Announced dividend dates (dividend_dates.py) from Polygon (also called
  # Massive), with the history sync: ticker symbols only are sent. The free
  # plan allows about 5 calls a minute, so one call each 12.5 s, at most 200
  # tickers a night (about 42 minutes), the longest-ago first; tickers asked
  # in the last 3 days wait. Without the POLYGON_API_KEY secret it fetches
  # nothing and says so. Its own job, so a slow or refused night doesn't hold
  # up the history sync, and its failure is reported by name.
  dividend-dates:
    if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Store announced dividend dates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python dividend_dates.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Dividend dates" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # The retention schedule (PLAN D5), applied nightly with the history sync:
  # never-confirmed sign-ups past 30 days, old error records, expired links and
  # sessions, day-old counts (tidy.py). Its own job, so a failed history sync
  # doesn't skip it and each failure is reported by name. Prints counts only.
  tidy:
    if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Tidy by the retention schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python tidy.py --db "$DATABASE_URL"
      # D15: how many advisors are due a licence re-check (11 months since
      # the last, or none on record) - counts only, emailed to the admin at
      # most once a week while any are (licence_check.py). Skipped quietly
      # without RESEND_API_KEY.
      - name: Count advisors due a licence check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python licence_check.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Nightly tidy" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  weekly-email:
    if: github.event.schedule == '30 12 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Send advisors their Monday email
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python weekly_email.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Advisors' Monday email" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  checkin-email:
    if: github.event.schedule == '15 13 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Send monthly walk reminders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          # the walk's feature flag (flags.py): nothing is sent unless it lists "walk"
          NORTHWEND_FLAGS: ${{ secrets.NORTHWEND_FLAGS }}
        run: python checkin_email.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Monthly walk reminders" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  trail-conditions:
    if: github.event.schedule == '0 13 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Send Trail Conditions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          # its feature flag (flags.py): nothing is sent unless it lists "trail_conditions";
          # nothing either while mailer.POSTAL_ADDRESS is empty (CAN-SPAM)
          NORTHWEND_FLAGS: ${{ secrets.NORTHWEND_FLAGS }}
        run: python trail_conditions.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Trail Conditions" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  news:
    if: github.event.schedule == '7 11-23 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Store news for held and watched tickers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # its feature flag (flags.py): nothing is fetched unless it lists "news_feed"
          NORTHWEND_FLAGS: ${{ secrets.NORTHWEND_FLAGS }}
        run: python news_feed.py --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Your news" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Paid advisor seats (billing.py; flag billing + gate L1a): reads every
  # known subscription - and any checkout still waiting - from Stripe and
  # updates the seats table. Counts only in the log. A seat Stripe couldn't
  # tell us about fails the run, so the admin hears of it. Here rather than a
  # Render cron: once a night is all it needs, and GitHub's nightly runs cost
  # nothing (the dropped runs were the every-15-minutes ones).
  billing-sync:
    if: github.event.schedule == '20 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt
      - name: Check every seat with Stripe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # the live copy's restricted key (rk_live_...); skipped while unset
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # the same values as the app's, when the owner changed them
          NORTHWEND_FOUNDING_SEATS: ${{ secrets.NORTHWEND_FOUNDING_SEATS }}
          NORTHWEND_SEAT_GRACE_DAYS: ${{ secrets.NORTHWEND_SEAT_GRACE_DAYS }}
        run: python billing.py --sync --db "$DATABASE_URL"
      - name: Tell the admin it failed
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python error_alerts.py job "Seat check with Stripe" --db "$DATABASE_URL" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
