name: Tests

# Runs the unit tests on every push and pull request, so a broken commit
# shows a red check on GitHub instead of only surfacing on the live app.
# The tests use temporary SQLite files and mocks only - no secrets, no
# network, and never the live Neon database. postgres-tests runs the
# Postgres ones on a throwaway Postgres container on the runner.
#
# unit-tests and postgres-tests are the checks main's branch protection
# requires - keep their names. lint and audit are separate jobs (not required
# yet; they can be added as required checks in the branch protection rule).
# Every action is pinned to a full commit SHA, its version in the comment;
# Dependabot (.github/dependabot.yml) proposes updates weekly.

on:
  push:
  pull_request:
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # coverage measuring slows the run down a little
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip  # reuse installed packages between runs
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: coverage run -m unittest discover -s tests
      # The share of the code the tests run, printed on every run (no gate yet:
      # ratchet it up, never down). It shows in the job's summary too.
      - name: Coverage
        if: ${{ !cancelled() }}
        run: |
          coverage report --format=total | tee total.txt
          echo "Coverage: $(cat total.txt)% of the code ran in the tests" >> "$GITHUB_STEP_SUMMARY"

  # The same app on Postgres, as the live app runs it (Neon): every way it
  # writes, every page, and an older database's upgrade - tests/test_postgres.py,
  # skipped in the job above. The database is a throwaway container on the
  # runner (trust sign-in, nothing to keep secret) - never Neon.
  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: northwend_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northwend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the Postgres tests
        env:
          NORTHWEND_TEST_PG: postgresql://postgres@localhost:5432/northwend_test
          NORTHWEND_TEST_PG_REQUIRED: "1"   # a skip here is a failure, not a pass
        run: python -m unittest tests.test_postgres -v

  # ruff check: a small rule set (pyproject.toml, [tool.ruff]) - unused and
  # undefined names, imports, syntax and whitespace.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .

  # Known vulnerabilities in the app's pinned packages (requirements.txt),
  # from the Python Packaging Advisory Database. A finding fails the job:
  # bump the pin (Dependabot usually has a PR open already).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Audit the dependencies
        run: pip-audit -r requirements.txt
