# Dependabot: once a week, one grouped pull request per kind - the Python
# packages (requirements.txt and pyproject.toml, which a test keeps equal)
# and the GitHub Actions the workflows use (pinned by commit SHA; Dependabot
# updates the SHA and its version comment together). The PRs go to staging,
# like every change (CLAUDE.md: staging first, then release to main).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      python-packages:
        patterns: ["*"]
    ignore:
      # pinned on purpose at 2.2.3 (requirements.txt): newer pandas wheels were
      # blocked on one machine, so no bumps at all - not even minor ones (a
      # minor bump to 2.3.3 slipped through on Oct 7 and was put back Oct 10)
      - dependency-name: pandas

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
